spring:
  application:
    name: edupilot
  messages:
    basename: i18n/messages
    encoding: UTF-8
    fallback-to-system-locale: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/edupilot}
    username: ${DB_USERNAME:eduflow}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public
  flyway:
    enabled: true
    baseline-on-migrate: true
  mail:
    host: localhost
    port: 1025
    username: ""
    password: ""
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}
  refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}

app:
  tenant:
    header-name: ${TENANT_HEADER_NAME:X-Center-Id}
  rate-limit:
    auth:
      login-max-attempts: ${AUTH_LOGIN_RATE_LIMIT:10}
      register-max-attempts: ${AUTH_REGISTER_RATE_LIMIT:5}
      refresh-max-attempts: ${AUTH_REFRESH_RATE_LIMIT:30}
      window-seconds: ${AUTH_RATE_LIMIT_WINDOW_SECONDS:60}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    org.springframework.security: INFO
    org.hibernate.SQL: INFO

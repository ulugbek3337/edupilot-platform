name: CI

on:
  push:
    branches: [main, "enterprise/**", "security/**"]
  pull_request:
    branches: [main, "security/**", "enterprise/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (Java 21)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Run Maven tests
        env:
          DB_PASSWORD: ci-only-not-a-production-secret
          JWT_SECRET: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
        run: mvn --batch-mode --no-transfer-progress test

  frontend:
    name: Frontend tests and build (Node 22)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Audit npm dependencies
        run: npm audit --audit-level=high

  infrastructure:
    name: Docker Compose validation
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate Compose configuration
        env:
          DB_NAME: edupilot_ci
          DB_USERNAME: edupilot_app
          DB_PASSWORD: ci-only-database-password
          POSTGRES_ADMIN_USER: edupilot_admin
          POSTGRES_ADMIN_PASSWORD: ci-only-admin-password
          REDIS_PASSWORD: ci-only-redis-password
        run: docker compose config --quiet

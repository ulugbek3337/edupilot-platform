name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main, "security/**", "enterprise/**", "feature/**", "ui/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (Java 21)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Run Maven tests
        env:
          DB_PASSWORD: ci-only-not-a-production-secret
          DB_MIGRATION_USERNAME: edupilot_migrator
          DB_MIGRATION_PASSWORD: ci-only-migration-secret
          JWT_SECRET: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
        run: mvn --batch-mode --no-transfer-progress test

  frontend:
    name: Frontend tests and build (Node 22)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Audit npm dependencies
        run: npm audit --audit-level=high

  infrastructure:
    name: Infrastructure and operations validation
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: edupilot_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-backup-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d edupilot_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate shell scripts
        run: |
          bash -n scripts/backup-postgres.sh scripts/restore-postgres.sh
          sh -n docker/postgres/init/01-create-app-role.sh

      - name: Exercise PostgreSQL backup and restore
        env:
          DB_NAME: edupilot_ci
          DB_USERNAME: postgres
          DB_PASSWORD: ci-only-backup-password
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          export PGPASSWORD="$DB_PASSWORD"
          psql -v ON_ERROR_STOP=1 -h "$DB_HOST" -U "$DB_USERNAME" -d "$DB_NAME" \
            -c "CREATE TABLE backup_smoke(id INTEGER PRIMARY KEY, value TEXT NOT NULL)" \
            -c "INSERT INTO backup_smoke VALUES (1, 'before-backup')"
          export BACKUP_DIR="$RUNNER_TEMP/edupilot-backups"
          scripts/backup-postgres.sh
          psql -v ON_ERROR_STOP=1 -h "$DB_HOST" -U "$DB_USERNAME" -d "$DB_NAME" \
            -c "UPDATE backup_smoke SET value='after-backup' WHERE id=1"
          backup="$(find "$BACKUP_DIR" -maxdepth 1 -type f -name 'edupilot-*.dump' -print -quit)"
          test -n "$backup"
          printf 'RESTORE\n' | scripts/restore-postgres.sh "$backup"
          restored="$(psql -At -h "$DB_HOST" -U "$DB_USERNAME" -d "$DB_NAME" -c 'SELECT value FROM backup_smoke WHERE id=1')"
          test "$restored" = "before-backup"
          cp "$backup" "$RUNNER_TEMP/no-checksum.dump"
          if scripts/restore-postgres.sh "$RUNNER_TEMP/no-checksum.dump" </dev/null; then
            echo "Restore unexpectedly accepted a backup without a checksum."
            exit 1
          fi

      - name: Validate Docker Compose configuration
        env:
          DB_NAME: edupilot_ci
          DB_USERNAME: edupilot_app
          DB_PASSWORD: ci-only-database-password
          DB_MIGRATION_USERNAME: edupilot_migrator
          DB_MIGRATION_PASSWORD: ci-only-migration-password
          POSTGRES_ADMIN_USER: edupilot_admin
          POSTGRES_ADMIN_PASSWORD: ci-only-admin-password
          REDIS_PASSWORD: ci-only-redis-password
        run: docker compose config --quiet

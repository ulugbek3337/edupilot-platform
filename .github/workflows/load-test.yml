name: Staging load test
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Staging base URL (for example https://staging.example.com)
        required: true
        type: string
permissions:
  contents: read
jobs:
  k6:
    name: Run authenticated academic API load test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Validate required secrets
        env:
          ACCESS_TOKEN: ${{ secrets.STAGING_LOAD_TEST_ACCESS_TOKEN }}
          CENTER_ID: ${{ vars.STAGING_LOAD_TEST_CENTER_ID }}
        run: |
          test -n "$ACCESS_TOKEN" || { echo "Missing STAGING_LOAD_TEST_ACCESS_TOKEN secret"; exit 1; }
          test -n "$CENTER_ID" || { echo "Missing STAGING_LOAD_TEST_CENTER_ID variable"; exit 1; }
      - name: Run k6 against staging
        env:
          BASE_URL: ${{ inputs.base_url }}
          ACCESS_TOKEN: ${{ secrets.STAGING_LOAD_TEST_ACCESS_TOKEN }}
          CENTER_ID: ${{ vars.STAGING_LOAD_TEST_CENTER_ID }}
        run: |
          docker run --rm \
            -e BASE_URL -e ACCESS_TOKEN -e CENTER_ID \
            -v "$PWD:/work:ro" -w /work \
            grafana/k6:0.54.0 run load-tests/k6-academic.js
